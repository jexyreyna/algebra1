<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeopardy: Derivadas Elementales</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
  :root {
    --bg-card: #ffffff;
    --bg-panel: #1e293b;
    --text-primary: #0f172a;
    --text-secondary: #64748b;
    --accent: #0d9488;
    --accent-hover: #0f766e;
    --accent-bg: #ccfbf1;
    --accent-text: #0f766e;
    --success-bg: #dcfce7;
    --success-text: #166534;
    --success-border: #86efac;
    --danger-bg: #fee2e2;
    --danger-text: #991b1b;
    --danger-border: #fca5a5;
    --border: #e2e8f0;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a, #134e4a, #0e7490);
    min-height: 100vh;
    padding: 2rem 1rem;
    color: var(--text-primary);
  }
  .container { max-width: 900px; margin: 0 auto; }
  input, button {
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 15px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
  }
  button { cursor: pointer; }
  #setup {
    max-width: 420px;
    margin: 4rem auto;
    background: var(--bg-card);
    border-radius: 16px;
    padding: 2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  #setup h1 { text-align: center; margin: 0.5rem 0 0.25rem; font-size: 22px; }
  #setup p { text-align: center; color: var(--text-secondary); margin: 0 0 1.5rem; }
  #setup label { font-size: 13px; color: var(--text-secondary); display: block; margin-bottom: 4px; }
  #setup .field { margin-bottom: 12px; }
  #startBtn, #continueBtn {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    padding: 12px;
    font-weight: 600;
    margin-top: 8px;
  }
  #startBtn:hover, #continueBtn:hover { background: var(--accent-hover); }
  #game { display: none; }
  #game h1 {
    text-align: center;
    color: white;
    font-size: 28px;
    margin: 0 0 1rem;
  }
  .header-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
  }
  .score-badge {
    padding: 8px 14px;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 600;
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.8);
    border: 1px solid rgba(255,255,255,0.2);
  }
  .score-badge.active {
    background: var(--success-bg);
    color: var(--success-text);
    border-color: var(--success-border);
  }
  #resetBtn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #dc2626;
    color: white;
    border: none;
    padding: 8px 14px;
    font-weight: 600;
  }
  #resetBtn:hover { background: #b91c1c; }
  #board {
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 12px;
    margin-bottom: 1.5rem;
    background: var(--bg-card);
    border-radius: 16px;
    padding: 1.5rem;
  }
  .cat-header {
    background: var(--bg-panel);
    color: white;
    text-align: center;
    padding: 12px 6px;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 600;
  }
  .point-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .point-btn {
    width: 100%;
    padding: 16px 6px;
    border-radius: var(--radius);
    font-size: 20px;
    font-weight: 700;
    border: none;
    background: linear-gradient(135deg, #0d9488, #0891b2);
    color: white;
  }
  .point-btn:hover:not(:disabled) { opacity: 0.9; transform: scale(1.02); }
  .point-btn.correct {
    background: var(--success-bg);
    color: var(--success-text);
    border: 2px solid var(--success-border);
  }
  .point-btn.incorrect {
    background: var(--danger-bg);
    color: var(--danger-text);
    border: 2px solid var(--danger-border);
  }
  .point-btn:disabled { cursor: default; }
  #questionPanel {
    display: none;
    background: var(--bg-card);
    border-radius: 16px;
    padding: 1.5rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .option-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 14px 16px;
    margin-bottom: 8px;
    border-radius: var(--radius);
    border: 2px solid var(--border);
    background: white;
    font-size: 16px;
  }
  .option-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--accent-bg);
  }
  #winnerPanel {
    display: none;
    text-align: center;
    background: linear-gradient(135deg, #fbbf24, #f97316);
    border-radius: 16px;
    padding: 2rem;
    margin-top: 1rem;
    color: #451a03;
  }
  .ktx { display: inline-block; }
</style>
</head>
<body>
<div class="container">

  <div id="setup">
    <div style="text-align:center; font-size:32px;">&#8721;</div>
    <h1>Jeopardy: derivadas elementales</h1>
    <p>2 jugadores &middot; potencia, exponencial, seno y coseno</p>
    <div class="field">
      <label for="p1">Estudiante 1</label>
      <input id="p1" type="text" value="Estudiante 1">
    </div>
    <div class="field">
      <label for="p2">Estudiante 2</label>
      <input id="p2" type="text" value="Estudiante 2">
    </div>
    <button id="startBtn">Iniciar juego</button>
  </div>

  <div id="game">
    <h1>Jeopardy: derivadas elementales</h1>
    <div class="header-row">
      <div id="badge1" class="score-badge"></div>
      <div id="badge2" class="score-badge"></div>
      <button id="resetBtn">&#8635; Reiniciar</button>
    </div>

    <div id="board"></div>

    <div id="questionPanel"></div>

    <div id="winnerPanel"></div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script>
(function(){
  function renderMath(root){
    var nodes = root.querySelectorAll('.ktx');
    nodes.forEach(function(el){
      try { katex.render(el.getAttribute('data-tex'), el, { throwOnError:false }); }
      catch(e){ el.textContent = el.getAttribute('data-tex'); }
    });
  }
  function K(tex){ return '<span class="ktx" data-tex="' + tex.replace(/"/g,'&quot;') + '"></span>'; }

  var categories = ['Reglas básicas', 'Seno y coseno', 'Combinando reglas'];
  var questions = {
    'Reglas básicas': [
      { points:100, q:"y = 5x^2 + 3", options:["y' = 10x","y' = 5x","y' = 10x + 3"], correct:0,
        fb:"Se aplica la regla de la potencia: la derivada de $x^n$ es $nx^{n-1}$. Para $5x^2$ la derivada es $10x$. La constante $+3$ desaparece porque su derivada es 0." },
      { points:200, q:"y = e^x + 2", options:["y' = e^x","y' = xe^{x-1}","y' = e^x + 2"], correct:0,
        fb:"La derivada de la exponencial natural $e^x$ es ella misma. La constante $+2$ desaparece al derivar." },
      { points:300, q:"y = \\sqrt{x}", options:["y' = \\dfrac{1}{2\\sqrt{x}}","y' = 2\\sqrt{x}","y' = \\dfrac{1}{\\sqrt{x}}"], correct:0,
        fb:"Se escribe $\\sqrt{x} = x^{1/2}$. Aplicando la regla de la potencia se obtiene $\\dfrac{1}{2}x^{-1/2} = \\dfrac{1}{2\\sqrt{x}}$." }
    ],
    'Seno y coseno': [
      { points:100, q:"y = \\sin x", options:["y' = \\cos x","y' = -\\cos x","y' = -\\sin x"], correct:0,
        fb:"Regla fundamental: $\\dfrac{d}{dx}(\\sin x) = \\cos x$." },
      { points:200, q:"y = \\cos x", options:["y' = \\sin x","y' = -\\sin x","y' = -\\cos x"], correct:1,
        fb:"Regla fundamental: $\\dfrac{d}{dx}(\\cos x) = -\\sin x$. Nótese el signo negativo, a diferencia de la derivada del seno." },
      { points:300, q:"y = 3\\sin x - 2\\cos x", options:["y' = 3\\cos x + 2\\sin x","y' = 3\\cos x - 2\\sin x","y' = -3\\cos x + 2\\sin x"], correct:0,
        fb:"Se deriva término a término: $\\dfrac{d}{dx}(3\\sin x) = 3\\cos x$ y $\\dfrac{d}{dx}(-2\\cos x) = 2\\sin x$. Sumando: $y' = 3\\cos x + 2\\sin x$." }
    ],
    'Combinando reglas': [
      { points:100, q:"y = \\dfrac{1}{x} + \\sin x", options:["y' = -\\dfrac{1}{x^2} + \\cos x","y' = \\dfrac{1}{x^2} + \\cos x","y' = -\\dfrac{1}{x^2} - \\cos x"], correct:0,
        fb:"$\\dfrac{1}{x} = x^{-1}$ tiene derivada $-x^{-2} = -\\dfrac{1}{x^2}$. La derivada de $\\sin x$ es $\\cos x$. Sumando: $y' = -\\dfrac{1}{x^2} + \\cos x$." },
      { points:200, q:"y = x^3 + \\cos x", options:["y' = 3x^2 - \\sin x","y' = 3x^2 + \\sin x","y' = x^2 - \\sin x"], correct:0,
        fb:"La derivada de $x^3$ es $3x^2$. La derivada de $\\cos x$ es $-\\sin x$. Sumando: $y' = 3x^2 - \\sin x$." },
      { points:300, q:"y = 5x^2 + \\sin x - e^x", options:["y' = 10x + \\cos x - e^x","y' = 10x - \\cos x - e^x","y' = 5x + \\cos x - e^x"], correct:0,
        fb:"Derivando cada término: $\\dfrac{d}{dx}(5x^2)=10x$, $\\dfrac{d}{dx}(\\sin x)=\\cos x$, $\\dfrac{d}{dx}(e^x)=e^x$. Uniendo: $y' = 10x + \\cos x - e^x$." }
    ]
  };

  var names = ["", "Estudiante 1", "Estudiante 2"];
  var scores = {1:0, 2:0};
  var current = 1;
  var answered = {};
  var results = {};
  var timer = null, timeLeft = 45;
  var active = null;

  document.getElementById('startBtn').onclick = function(){
    names[1] = document.getElementById('p1').value.trim() || 'Estudiante 1';
    names[2] = document.getElementById('p2').value.trim() || 'Estudiante 2';
    document.getElementById('setup').style.display = 'none';
    document.getElementById('game').style.display = 'block';
    renderHeader();
    renderBoard();
  };

  document.getElementById('resetBtn').onclick = function(){
    scores = {1:0,2:0}; current = 1; answered = {}; results = {}; active = null;
    if (timer) clearInterval(timer);
    document.getElementById('winnerPanel').style.display = 'none';
    document.getElementById('questionPanel').style.display = 'none';
    renderHeader();
    renderBoard();
  };

  function renderHeader(){
    for (var i=1;i<=2;i++){
      var el = document.getElementById('badge'+i);
      el.textContent = names[i] + ': ' + scores[i];
      el.className = 'score-badge' + (current === i ? ' active' : '');
    }
  }

  function renderBoard(){
    var board = document.getElementById('board');
    board.innerHTML = '';
    categories.forEach(function(cat){
      var col = document.createElement('div');
      var header = document.createElement('div');
      header.className = 'cat-header';
      header.textContent = cat;
      col.appendChild(header);
      var wrap = document.createElement('div');
      wrap.className = 'point-list';
      questions[cat].forEach(function(item, idx){
        var key = cat + '-' + idx;
        var btn = document.createElement('button');
        btn.className = 'point-btn';
        var done = answered[key];
        if (done) {
          btn.classList.add(results[key].correct ? 'correct' : 'incorrect');
          btn.disabled = true;
          btn.innerHTML = '$' + item.points + ' ' + (results[key].correct ? '&#10003;' : '&#10007;');
        } else {
          btn.textContent = '$' + item.points;
          btn.onclick = function(){ openQuestion(cat, idx); };
        }
        wrap.appendChild(btn);
      });
      col.appendChild(wrap);
      board.appendChild(col);
    });
  }

  function openQuestion(cat, idx){
    active = { cat: cat, idx: idx };
    timeLeft = 45;
    var panel = document.getElementById('questionPanel');
    panel.style.display = 'block';
    renderAnswering();
    if (timer) clearInterval(timer);
    timer = setInterval(function(){
      timeLeft--;
      var t = document.getElementById('timeLeft');
      if (t) t.textContent = timeLeft + 's';
      if (timeLeft <= 0){
        clearInterval(timer);
        submitAnswer(null);
      }
    }, 1000);
  }

  function renderAnswering(){
    var item = questions[active.cat][active.idx];
    var panel = document.getElementById('questionPanel');
    var html = '';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">';
    html += '<span style="font-size:14px;color:var(--text-secondary);">' + active.cat + ' &middot; $' + item.points + '</span>';
    html += '<span style="font-weight:700;color:#dc2626;">&#9200; <span id="timeLeft">' + timeLeft + 's</span></span>';
    html += '</div>';
    html += '<p style="font-size:14px;color:var(--text-secondary);margin:0 0 0.75rem;">Turno de <strong style="color:var(--text-primary);">' + names[current] + '</strong></p>';
    html += '<p style="font-size:13px;color:var(--text-secondary);margin:0 0 4px;">Determine $y\'$:</p>';
    html += '<div style="font-size:22px;margin:0 0 1.25rem;">' + K(item.q) + '</div>';
    item.options.forEach(function(opt, i){
      html += '<button class="option-btn" data-i="' + i + '">' + K(opt) + '</button>';
    });
    panel.innerHTML = html;
    renderMath(panel);
    var btns = panel.querySelectorAll('.option-btn');
    btns.forEach(function(b){
      b.onclick = function(){
        if (timer) clearInterval(timer);
        submitAnswer(parseInt(b.getAttribute('data-i')));
      };
    });
  }

  function submitAnswer(answerIdx){
    var item = questions[active.cat][active.idx];
    var isCorrect = answerIdx === item.correct;
    var key = active.cat + '-' + active.idx;
    results[key] = { correct: isCorrect, player: current };
    if (isCorrect) { scores[current] += item.points; }
    renderFeedback(answerIdx, isCorrect, item);
  }

  function renderFeedback(answerIdx, isCorrect, item){
    var panel = document.getElementById('questionPanel');
    var html = '';
    html += '<p style="font-size:14px;color:var(--text-secondary);margin:0 0 0.5rem;">' + active.cat + ' &middot; $' + item.points + '</p>';
    html += '<div style="font-size:20px;margin:0 0 1rem;">' + K(item.q) + '</div>';
    if (answerIdx !== null){
      html += '<div style="padding:12px 14px;border-radius:var(--radius);background:var(--accent-bg);margin-bottom:10px;">';
      html += '<p style="font-size:13px;color:var(--accent-text);margin:0 0 4px;font-weight:600;">Tu respuesta</p>';
      html += '<div style="font-size:18px;">' + K(item.options[answerIdx]) + '</div></div>';
    } else {
      html += '<div style="padding:12px 14px;border-radius:var(--radius);background:var(--danger-bg);margin-bottom:10px;">';
      html += '<p style="margin:0;color:var(--danger-text);font-weight:600;">Se agotó el tiempo</p></div>';
    }
    html += '<div style="padding:12px 14px;border-radius:var(--radius);background:var(--success-bg);margin-bottom:10px;">';
    html += '<p style="font-size:13px;color:var(--success-text);margin:0 0 4px;font-weight:600;">Respuesta correcta</p>';
    html += '<div style="font-size:18px;">' + K(item.options[item.correct]) + '</div></div>';
    html += '<div style="padding:12px 14px;border-radius:var(--radius);background:' + (isCorrect ? 'var(--success-bg)' : 'var(--danger-bg)') + ';margin-bottom:10px;display:flex;align-items:center;gap:8px;">';
    html += '<span style="font-weight:700;color:' + (isCorrect ? 'var(--success-text)' : 'var(--danger-text)') + ';">' + (isCorrect ? ('+' + item.points + ' puntos para ' + names[current]) : '0 puntos, sin penalización') + '</span></div>';
    html += '<div style="padding:12px 14px;border-radius:var(--radius);background:#f1f5f9;margin-bottom:14px;">';
    html += '<p style="font-size:13px;color:var(--text-secondary);margin:0 0 4px;font-weight:600;">Explicación</p>';
    html += '<p class="ktx-block" style="margin:0;line-height:1.8;" data-fb="1">' + item.fb + '</p></div>';
    html += '<button id="continueBtn">Continuar</button>';
    panel.innerHTML = html;
    renderMath(panel);
    renderInlineLatex(panel.querySelector('[data-fb]'));
    document.getElementById('continueBtn').onclick = continueGame;
  }

  function renderInlineLatex(el){
    if (!el) return;
    var text = el.textContent;
    var parts = text.split(/(\$[^$]+\$)/g);
    el.innerHTML = '';
    parts.forEach(function(part){
      if (part.charAt(0) === '$' && part.charAt(part.length-1) === '$'){
        var span = document.createElement('span');
        try { katex.render(part.slice(1,-1), span, { throwOnError:false }); }
        catch(e){ span.textContent = part; }
        el.appendChild(span);
      } else {
        el.appendChild(document.createTextNode(part));
      }
    });
  }

  function continueGame(){
    var key = active.cat + '-' + active.idx;
    answered[key] = true;
    active = null;
    document.getElementById('questionPanel').style.display = 'none';
    current = current === 2 ? 1 : 2;
    renderHeader();
    renderBoard();
    if (Object.keys(answered).length === 9){
      showWinner();
    }
  }

  function showWinner(){
    var panel = document.getElementById('winnerPanel');
    panel.style.display = 'block';
    var msg;
    if (scores[1] === scores[2]) { msg = 'Empate entre ' + names[1] + ' y ' + names[2]; }
    else { msg = 'Ganador: ' + (scores[1] > scores[2] ? names[1] : names[2]); }
    panel.innerHTML = '<div style="font-size:32px;">&#127942;</div>' +
      '<h2 style="margin:0.5rem 0;">Juego terminado</h2>' +
      '<p style="font-size:18px;font-weight:700;margin:0 0 8px;">' + msg + '</p>' +
      '<p style="margin:0;">' + names[1] + ': ' + scores[1] + ' &middot; ' + names[2] + ': ' + scores[2] + '</p>';
  }
})();
</script>
</body>
</html>
