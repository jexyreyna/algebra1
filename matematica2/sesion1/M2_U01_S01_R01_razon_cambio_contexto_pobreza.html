<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reto: Gasto Público en Educación</title>
<style>
  :root {
    --text-primary: #0f172a;
    --text-secondary: #64748b;
    --surface-1: #f1f5f9;
    --surface-card: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a, #134e4a, #0e7490);
    min-height: 100vh;
    padding: 2rem 1rem;
    color: var(--text-primary);
  }
  .container {
    max-width: 640px;
    margin: 0 auto;
    background: var(--surface-card);
    border-radius: 16px;
    padding: 1.75rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  h1 {
    font-size: 19px;
    font-weight: 600;
    text-align: center;
    margin: 0 0 1.25rem;
  }
  svg { width: 100%; height: auto; display: block; }
  .question-card {
    background: var(--surface-1);
    border-radius: 12px;
    padding: 1rem;
    margin-top: 1rem;
    text-align: center;
  }
  #question { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
  button {
    padding: 10px 22px;
    font-weight: 600;
    font-size: 14px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    background: white;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #f1f5f9; }
  button:disabled { opacity: 0.5; cursor: default; }
  #feedback { display: none; margin-top: 12px; }
  .fb-card {
    background: var(--surface-1);
    border-radius: 12px;
    padding: 1rem;
    border-left: 3px solid;
  }
  .fb-head { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
  .fb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .fb-stat { background: var(--surface-card); border-radius: 8px; padding: 0.6rem; border-left: 3px solid; }
  .fb-stat-label { font-size: 11px; color: var(--text-secondary); margin: 0; }
  .fb-stat-value { font-size: 16px; font-weight: 600; margin: 0; }
  .fb-text { font-size: 14px; line-height: 1.7; margin: 0 0 12px; }
  #btnNext { width: 100%; font-weight: 600; }
</style>
</head>
<body>
<div class="container">
  <h1>Gasto público en educación (2000–2020)</h1>

  <svg id="plot" viewBox="0 0 560 300"></svg>

  <div class="question-card">
    <p id="question"></p>
    <div style="display:flex; justify-content:center; gap:10px;">
      <button id="btnTrue">Verdadero</button>
      <button id="btnFalse">Falso</button>
    </div>
  </div>

  <div id="feedback"></div>
</div>

<script>
(function(){
  var years = [2000,2005,2010,2015,2020];
  var values = {2000:37.5,2005:10.5,2010:45.7,2015:78.2,2020:55.8};
  var W=560,H=300,mL=40,mR=15,mT=15,mB=35;
  var vMax=100;
  function sx(i){ return mL + (i+0.5)*((W-mL-mR)/years.length); }
  function sy(v){ return H-mB - (v/vMax)*(H-mT-mB); }
  var barW = (W-mL-mR)/years.length*0.55;
  var svg=document.getElementById('plot');
  var ns='http://www.w3.org/2000/svg';
  function el(tag,attrs){ var e=document.createElementNS(ns,tag); for(var k in attrs) e.setAttribute(k,attrs[k]); return e; }

  for (var gy=0; gy<=vMax; gy+=25){
    svg.appendChild(el('line',{x1:mL,y1:sy(gy),x2:W-mR,y2:sy(gy),stroke:'#e1e0d9','stroke-width':1}));
  }
  svg.appendChild(el('line',{x1:mL,y1:sy(0),x2:W-mR,y2:sy(0),stroke:'#c3c2b7','stroke-width':1.2}));

  var bars = {};
  years.forEach(function(yr,i){
    var v = values[yr];
    var x = sx(i) - barW/2;
    var y = sy(v);
    var bar = el('rect',{x:x,y:y,width:barW,height:(H-mB)-y,fill:'#B4B2A9',rx:4});
    svg.appendChild(bar);
    bars[yr]=bar;
    var lbl = el('text',{x:sx(i),y:y-8,'text-anchor':'middle','font-size':13,'font-weight':'600',fill:'#52514e'});
    lbl.textContent = v;
    svg.appendChild(lbl);
    var name = el('text',{x:sx(i),y:H-mB+18,'text-anchor':'middle','font-size':12,fill:'#52514e'});
    name.textContent = yr;
    svg.appendChild(name);
  });

  var bracket1 = el('path',{fill:'none',stroke:'#0F6E56','stroke-width':2,opacity:0});
  var bracket2 = el('path',{fill:'none',stroke:'#993C1D','stroke-width':2,opacity:0});
  var blabel1 = el('text',{'font-size':13,'font-weight':'600',fill:'#0F6E56','text-anchor':'middle',opacity:0});
  var blabel2 = el('text',{'font-size':13,'font-weight':'600',fill:'#993C1D','text-anchor':'middle',opacity:0});
  svg.appendChild(bracket1); svg.appendChild(bracket2); svg.appendChild(blabel1); svg.appendChild(blabel2);

  function fmt(n){ var s = n.toFixed(1); return (n>=0?'+':'') + s; }

  function drawBracket(pathEl, labelEl, i1, i2, delta, y){
    var x1 = sx(i1), x2 = sx(i2);
    var d = 'M ' + x1 + ' ' + y + ' L ' + x1 + ' ' + (y-8) + ' L ' + x2 + ' ' + (y-8) + ' L ' + x2 + ' ' + y;
    pathEl.setAttribute('d', d);
    pathEl.setAttribute('opacity', 1);
    labelEl.setAttribute('x', (x1+x2)/2);
    labelEl.setAttribute('y', y-14);
    labelEl.textContent = fmt(delta);
    labelEl.setAttribute('opacity', 1);
  }

  var comparisons = [
    {a:[2000,2005], b:[2005,2010]},
    {a:[2005,2010], b:[2010,2015]},
    {a:[2010,2015], b:[2015,2020]}
  ];
  var lastIdx = -1;
  var current = null;

  function resetChart(){
    years.forEach(function(yr){ bars[yr].setAttribute('fill','#B4B2A9'); });
    bracket1.setAttribute('opacity',0); bracket2.setAttribute('opacity',0);
    blabel1.setAttribute('opacity',0); blabel2.setAttribute('opacity',0);
  }

  function newQuestion(){
    resetChart();
    document.getElementById('feedback').style.display = 'none';
    document.getElementById('btnTrue').disabled = false;
    document.getElementById('btnFalse').disabled = false;
    var idx;
    do { idx = Math.floor(Math.random()*comparisons.length); } while (idx === lastIdx && comparisons.length > 1);
    lastIdx = idx;
    current = comparisons[idx];
    var deltaA = values[current.a[1]] - values[current.a[0]];
    var deltaB = values[current.b[1]] - values[current.b[0]];
    current.deltaA = deltaA;
    current.deltaB = deltaB;
    document.getElementById('question').textContent =
      '¿El incremento de ' + current.b[0] + ' a ' + current.b[1] + ' es mayor que el incremento de ' + current.a[0] + ' a ' + current.a[1] + '?';
  }

  function reveal(){
    var idxA0 = years.indexOf(current.a[0]), idxA1 = years.indexOf(current.a[1]);
    var idxB0 = years.indexOf(current.b[0]), idxB1 = years.indexOf(current.b[1]);
    [current.a[0],current.a[1]].forEach(function(yr){ bars[yr].setAttribute('fill','#0F6E56'); });
    [current.b[0],current.b[1]].forEach(function(yr){ bars[yr].setAttribute('fill','#993C1D'); });
    drawBracket(bracket1, blabel1, idxA0, idxA1, current.deltaA, 30);
    drawBracket(bracket2, blabel2, idxB0, idxB1, current.deltaB, 55);
  }

  function handleAnswer(userSaidTrue){
    var correct = current.deltaB > current.deltaA;
    var isRight = userSaidTrue === correct;
    reveal();
    document.getElementById('btnTrue').disabled = true;
    document.getElementById('btnFalse').disabled = true;
    var fb = document.getElementById('feedback');
    fb.style.display = 'block';
    var headColor = isRight ? '#0F6E56' : '#993C1D';
    var headText = (isRight ? 'Correcto: la afirmación es ' : 'No es correcto: la afirmación es ') + (correct ? 'verdadera' : 'falsa');
    var d1 = current.deltaA.toFixed(1), d2 = current.deltaB.toFixed(1);
    var compareWord = correct ? 'mayor' : (current.deltaB === current.deltaA ? 'igual' : 'menor');
    fb.innerHTML =
      '<div class="fb-card" style="border-left-color:'+headColor+';">' +
        '<p class="fb-head" style="color:'+headColor+';">' + headText + '</p>' +
        '<div class="fb-grid">' +
          '<div class="fb-stat" style="border-left-color:#0F6E56;">' +
            '<p class="fb-stat-label">' + current.a[0] + ' \u2192 ' + current.a[1] + '</p>' +
            '<p class="fb-stat-value" style="color:#0F6E56;">' + fmt(current.deltaA) + '</p>' +
          '</div>' +
          '<div class="fb-stat" style="border-left-color:#993C1D;">' +
            '<p class="fb-stat-label">' + current.b[0] + ' \u2192 ' + current.b[1] + '</p>' +
            '<p class="fb-stat-value" style="color:#993C1D;">' + fmt(current.deltaB) + '</p>' +
          '</div>' +
        '</div>' +
        '<p class="fb-text">El cambio de ' + current.a[0] + ' a ' + current.a[1] + ' fue de ' + d1 + ' millones, y el de ' + current.b[0] + ' a ' + current.b[1] + ' fue de ' + d2 + ' millones. El segundo incremento es ' + compareWord + ' que el primero, así que la afirmación es <strong>' + (correct?'verdadera':'falsa') + '</strong>.</p>' +
        '<button id="btnNext">Siguiente pregunta</button>' +
      '</div>';
    document.getElementById('btnNext').onclick = newQuestion;
  }

  document.getElementById('btnTrue').onclick = function(){ handleAnswer(true); };
  document.getElementById('btnFalse').onclick = function(){ handleAnswer(false); };

  newQuestion();
})();
</script>
</body>
</html>
