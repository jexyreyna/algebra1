<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pendiente de Recta</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #07060f; font-family: 'Segoe UI', sans-serif; padding: 16px; min-height: 100vh; }
#app { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-start; max-width: 780px; margin: 0 auto; }
#canvas-wrap { flex: 1; min-width: 320px; }
canvas { display: block; width: 100%; border-radius: 14px; border: 2.5px solid #a78bfa; cursor: crosshair; background: #0f0e17; }
#panel {
  width: 224px; min-width: 200px;
  background: #1a1a2e; border: 2px solid #7c3aed;
  border-radius: 14px; padding: 14px;
  display: flex; flex-direction: column; gap: 12px;
}
.panel-title { font-size: 13px; font-weight: 700; color: #e0aaff; text-align: center; letter-spacing: 1px; text-transform: uppercase; border-bottom: 1.5px solid #4c1d95; padding-bottom: 8px; }
.coord-row { display: flex; flex-direction: column; gap: 3px; }
.tag { font-size: 10px; border-radius: 20px; padding: 2px 10px; font-weight: 700; display: inline-block; width: fit-content; }
.coord-val { font-size: 19px; font-weight: 700; font-family: monospace; line-height: 1.2; }
.divider { border: none; border-top: 1.5px solid #312e81; }
.formula-block { background: #0f0e17; border: 1.5px solid #4c1d95; border-radius: 10px; padding: 10px 12px; }
.formula-label { font-size: 10px; font-weight: 700; margin-bottom: 6px; letter-spacing: 0.8px; text-transform: uppercase; }
.frac-wrap { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 4px 0; font-family: monospace; }
.frac { display: inline-flex; flex-direction: column; align-items: center; }
.frac-num { padding-bottom: 2px; border-bottom: 2px solid currentColor; font-size: 16px; font-weight: 700; line-height: 1.2; min-width: 20px; text-align: center; }
.frac-den { padding-top: 2px; font-size: 16px; font-weight: 700; line-height: 1.2; min-width: 20px; text-align: center; }
.eq { font-size: 18px; font-weight: 700; color: #fff; }
.result-decimal { font-size: 15px; text-align: center; font-family: monospace; font-weight: 700; color: #34d399; }
.hint { font-size: 11px; color: #a78bfa; text-align: center; line-height: 1.6; font-weight: 500; }
.undef { color: #f87171; font-size: 13px; text-align: center; font-weight: 700; }
.placeholder { color: #6b7280; font-size: 12px; text-align: center; padding: 8px 0; }
</style>
</head>
<body>
<div id="app">
  <div id="canvas-wrap">
    <canvas id="c" width="500" height="500"></canvas>
  </div>
  <div id="panel">
    <div class="panel-title">✨ Pendiente de recta</div>
    <div class="coord-row">
      <span class="tag" style="background:#fde68a;color:#78350f;">🔴 Punto A</span>
      <span class="coord-val" id="pA" style="color:#fbbf24;">—</span>
    </div>
    <div class="coord-row">
      <span class="tag" style="background:#a5f3fc;color:#0c4a6e;">🔵 Punto B</span>
      <span class="coord-val" id="pB" style="color:#38bdf8;">—</span>
    </div>
    <hr class="divider">

    <div class="formula-block">
      <div class="formula-label" style="color:#c4b5fd;">📐 Fórmula</div>
      <div class="frac-wrap">
        <span style="color:#c4b5fd;font-size:16px;font-weight:700;font-family:monospace;">m =</span>
        <span class="frac" style="color:#c4b5fd;">
          <span class="frac-num">y₂ − y₁</span>
          <span class="frac-den">x₂ − x₁</span>
        </span>
      </div>
    </div>

    <div class="formula-block">
      <div class="formula-label" style="color:#6ee7b7;">➗ Diferencias</div>
      <div id="diff-area" class="placeholder">Coloca los puntos</div>
    </div>

    <div class="formula-block">
      <div class="formula-label" style="color:#f9a8d4;">🔢 Fracción simplificada</div>
      <div id="frac-area" class="placeholder">—</div>
    </div>

    <div class="formula-block">
      <div class="formula-label" style="color:#86efac;">💡 Decimal</div>
      <div class="result-decimal" id="dec">—</div>
    </div>

    <p class="hint" id="hint">👆 Clic para poner el<br><b>Punto A</b> en el plano</p>
  </div>
</div>

<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const SIZE = 500, CELLS = 20, STEP = SIZE / CELLS;
const OX = SIZE/2, OY = SIZE/2;
let pts = [], dragging = null;

function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;}
function toGrid(px,py){return{gx:Math.round((px-OX)/STEP),gy:Math.round((OY-py)/STEP)};}
function toCv(gx,gy){return{px:OX+gx*STEP,py:OY-gy*STEP};}

function draw(){
  ctx.clearRect(0,0,SIZE,SIZE);
  ctx.fillStyle='#0f0e17';
  ctx.fillRect(0,0,SIZE,SIZE);

  // Cuadrícula fina
  ctx.strokeStyle='rgba(139,92,246,0.13)';
  ctx.lineWidth=0.8;
  for(let i=0;i<=CELLS;i++){
    ctx.beginPath();ctx.moveTo(i*STEP,0);ctx.lineTo(i*STEP,SIZE);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,i*STEP);ctx.lineTo(SIZE,i*STEP);ctx.stroke();
  }
  // Cuadrícula mayor
  ctx.strokeStyle='rgba(139,92,246,0.32)';
  ctx.lineWidth=1.2;
  for(let i=0;i<=CELLS;i+=5){
    ctx.beginPath();ctx.moveTo(i*STEP,0);ctx.lineTo(i*STEP,SIZE);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,i*STEP);ctx.lineTo(SIZE,i*STEP);ctx.stroke();
  }

  // Eje X naranja
  ctx.save();
  ctx.strokeStyle='#f97316'; ctx.lineWidth=3;
  ctx.shadowColor='#f97316'; ctx.shadowBlur=8;
  ctx.beginPath();ctx.moveTo(0,OY);ctx.lineTo(SIZE,OY);ctx.stroke();
  ctx.fillStyle='#f97316';
  ctx.beginPath();ctx.moveTo(SIZE-4,OY);ctx.lineTo(SIZE-14,OY-6);ctx.lineTo(SIZE-14,OY+6);ctx.closePath();ctx.fill();
  ctx.restore();

  // Eje Y cyan
  ctx.save();
  ctx.strokeStyle='#06b6d4'; ctx.lineWidth=3;
  ctx.shadowColor='#06b6d4'; ctx.shadowBlur=8;
  ctx.beginPath();ctx.moveTo(OX,SIZE);ctx.lineTo(OX,0);ctx.stroke();
  ctx.fillStyle='#06b6d4';
  ctx.beginPath();ctx.moveTo(OX,4);ctx.lineTo(OX-6,14);ctx.lineTo(OX+6,14);ctx.closePath();ctx.fill();
  ctx.restore();

  // Etiquetas
  ctx.font='bold 14px monospace';
  ctx.fillStyle='#f97316'; ctx.textAlign='center'; ctx.fillText('x',SIZE-8,OY-12);
  ctx.fillStyle='#06b6d4'; ctx.textAlign='left'; ctx.fillText('y',OX+8,16);

  ctx.font='bold 10px monospace';
  for(let g=-9;g<=9;g++){
    if(g===0||g%2!==0) continue;
    const{px}=toCv(g,0);
    ctx.fillStyle='rgba(251,191,36,0.75)'; ctx.textAlign='center';
    ctx.fillText(g,px,OY+16);
    const{py}=toCv(0,g);
    ctx.fillStyle='rgba(56,189,248,0.75)'; ctx.textAlign='right';
    ctx.fillText(g,OX-7,py+4);
  }
  ctx.fillStyle='rgba(255,255,255,0.45)'; ctx.textAlign='right';
  ctx.fillText('0',OX-6,OY+15);

  // Recta
  if(pts.length===2){
    const A=toCv(pts[0].gx,pts[0].gy), B=toCv(pts[1].gx,pts[1].gy);
    const dx=B.px-A.px, dy=B.py-A.py, len=Math.sqrt(dx*dx+dy*dy);
    ctx.save();
    ctx.strokeStyle='#4ade80'; ctx.lineWidth=2.5;
    ctx.shadowColor='#4ade80'; ctx.shadowBlur=12;
    if(len>0){
      const ux=dx/len,uy=dy/len;
      ctx.beginPath();ctx.moveTo(A.px-ux*700,A.py-uy*700);ctx.lineTo(A.px+ux*700,A.py+uy*700);ctx.stroke();
    } else {
      ctx.beginPath();ctx.moveTo(A.px,0);ctx.lineTo(A.px,SIZE);ctx.stroke();
    }
    ctx.restore();

    const dxG=pts[1].gx-pts[0].gx, dyG=pts[1].gy-pts[0].gy;
    if(dxG!==0||dyG!==0){
      ctx.save(); ctx.setLineDash([6,4]); ctx.lineWidth=2;
      ctx.strokeStyle='#fbbf24'; ctx.shadowColor='#fbbf24'; ctx.shadowBlur=6;
      ctx.beginPath();ctx.moveTo(A.px,A.py);ctx.lineTo(B.px,A.py);ctx.stroke();
      ctx.strokeStyle='#34d399'; ctx.shadowColor='#34d399';
      ctx.beginPath();ctx.moveTo(B.px,A.py);ctx.lineTo(B.px,B.py);ctx.stroke();
      ctx.restore();
      ctx.font='bold 12px monospace';
      ctx.fillStyle='#fbbf24'; ctx.textAlign='center';
      ctx.fillText('Δx='+dxG,(A.px+B.px)/2,A.py+(dyG>=0?20:-12));
      ctx.fillStyle='#34d399'; ctx.textAlign=B.px>OX?'left':'right';
      ctx.fillText('Δy='+dyG,B.px+(B.px>OX?7:-7),(A.py+B.py)/2+4);
    }
  }

  // Puntos
  const cols=['#f59e0b','#38bdf8'], glow=['#f59e0b','#38bdf8'], lbl=['A','B'];
  pts.forEach((p,i)=>{
    const{px,py}=toCv(p.gx,p.gy);
    ctx.save();
    ctx.shadowColor=glow[i]; ctx.shadowBlur=18;
    ctx.beginPath();ctx.arc(px,py,10,0,Math.PI*2);
    ctx.fillStyle=cols[i]; ctx.fill();
    ctx.restore();
    ctx.beginPath();ctx.arc(px,py,10,0,Math.PI*2);
    ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#0f0e17'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center';
    ctx.fillText(lbl[i],px,py+4);
    // coordenada junto al punto
    ctx.save();
    ctx.font='bold 11px monospace';
    ctx.fillStyle=cols[i];
    ctx.shadowColor=glow[i]; ctx.shadowBlur=6;
    const lx=px<SIZE-80?px+15:px-15;
    ctx.textAlign=px<SIZE-80?'left':'right';
    ctx.fillText(`(${p.gx}, ${p.gy})`,lx,py-14);
    ctx.restore();
  });
}

// Fracción HTML pura sin LaTeX externo
function makeFrac(num, den, color){
  return `<span class="frac-wrap">
    <span class="frac" style="color:${color};">
      <span class="frac-num">${num}</span>
      <span class="frac-den">${den}</span>
    </span>
  </span>`;
}

function updatePanel(){
  const $=id=>document.getElementById(id);

  if(pts.length===0){
    $('pA').textContent='—'; $('pB').textContent='—';
    $('diff-area').innerHTML='<span class="placeholder">Coloca los puntos</span>';
    $('frac-area').innerHTML='<span class="placeholder">—</span>';
    $('dec').textContent='—';
    $('hint').innerHTML='👆 Clic para poner el<br><b>Punto A</b> en el plano'; return;
  }
  if(pts.length===1){
    $('pA').textContent=`(${pts[0].gx}, ${pts[0].gy})`; $('pB').textContent='—';
    $('diff-area').innerHTML='<span class="placeholder">Falta el Punto B</span>';
    $('frac-area').innerHTML='<span class="placeholder">—</span>';
    $('dec').textContent='—';
    $('hint').innerHTML='👆 Clic para poner el<br><b>Punto B</b> en el plano'; return;
  }

  const A=pts[0], B=pts[1];
  $('pA').textContent=`(${A.gx}, ${A.gy})`;
  $('pB').textContent=`(${B.gx}, ${B.gy})`;
  $('hint').innerHTML='🖱️ Arrastra los puntos<br>para explorar';

  const dy=B.gy-A.gy, dx=B.gx-A.gx;

  // Diferencias como fracción HTML
  $('diff-area').innerHTML=`
    <div class="frac-wrap" style="flex-wrap:wrap;gap:4px;">
      <span style="color:#6ee7b7;font-size:15px;font-weight:700;font-family:monospace;">m =</span>
      ${makeFrac(`${B.gy} − (${A.gy})`, `${B.gx} − (${A.gx})`, '#6ee7b7')}
      <span class="eq">=</span>
      ${makeFrac(dy, dx, '#6ee7b7')}
    </div>`;

  if(dx===0){
    $('frac-area').innerHTML='<span class="undef">⚠️ Pendiente indefinida<br>(recta vertical)</span>';
    $('dec').textContent='m → ∞';
  } else {
    const g=gcd(Math.abs(dy),Math.abs(dx));
    let fn=dy/g, fd=dx/g;
    if(fd<0){fn=-fn;fd=-fd;}
    if(fd===1){
      $('frac-area').innerHTML=`<span style="color:#f9a8d4;font-size:22px;font-weight:700;font-family:monospace;">m = ${fn}</span>`;
    } else {
      $('frac-area').innerHTML=`<div class="frac-wrap">
        <span style="color:#f9a8d4;font-size:16px;font-weight:700;font-family:monospace;">m =</span>
        ${makeFrac(fn, fd, '#f9a8d4')}
      </div>`;
    }
    $('dec').textContent=`m = ${(dy/dx).toFixed(4)}`;
  }
}

function getR(){return cv.getBoundingClientRect();}
function cxy(e){const r=getR();const sx=SIZE/r.width,sy=SIZE/r.height;return{cx:(e.clientX-r.left)*sx,cy:(e.clientY-r.top)*sy};}
function near(cx,cy){for(let i=0;i<pts.length;i++){const c=toCv(pts[i].gx,pts[i].gy);if(Math.hypot(cx-c.px,cy-c.py)<20)return i;}return -1;}

cv.addEventListener('mousedown',e=>{const{cx,cy}=cxy(e);const n=near(cx,cy);if(n>=0){dragging=n;return;}if(pts.length<2){pts.push(toGrid(cx,cy));draw();updatePanel();}});
cv.addEventListener('mousemove',e=>{if(dragging===null)return;const{cx,cy}=cxy(e);pts[dragging]=toGrid(cx,cy);draw();updatePanel();});
cv.addEventListener('mouseup',()=>{dragging=null;});
cv.addEventListener('mouseleave',()=>{dragging=null;});
cv.addEventListener('dblclick',()=>{pts=[];draw();updatePanel();});
cv.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];const r=getR();const sx=SIZE/r.width,sy=SIZE/r.height;const cx=(t.clientX-r.left)*sx,cy=(t.clientY-r.top)*sy;const n=near(cx,cy);if(n>=0){dragging=n;return;}if(pts.length<2){pts.push(toGrid(cx,cy));draw();updatePanel();}},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(dragging===null)return;const t=e.touches[0];const r=getR();const sx=SIZE/r.width,sy=SIZE/r.height;pts[dragging]=toGrid((t.clientX-r.left)*sx,(t.clientY-r.top)*sy);draw();updatePanel();},{passive:false});
cv.addEventListener('touchend',()=>{dragging=null;});

draw(); updatePanel();
</script>
</body>
</html>
