    { t: "No es verdad que Luis sepa cantar y bailar al mismo tiempo.", p: ["p: Luis sabe cantar.", "q: Luis sabe bailar."], c: "Negación externa + Conjunción (y)", opts: ["Negación externa + Conjunción (y)", "Disyunción + Condicional"], f: "Negación de habilidades simultáneas." },

    { t: "La reunión será el martes o el miércoles, pero no empezará tarde.", p: ["p: Reunión martes.", "q: Reunión miércoles.", "r: Empezará tarde."], c: "Disyunción (o) + Conjunción (pero) + Negación (no)", opts: ["Disyunción (o) + Conjunción (pero) + Negación (no)", "Condicional + Conjunción"], f: "'Pero' es conjunción en lógica formal." },
    { t: "Si el vaso se cae y es de vidrio, entonces se romperá.", p: ["p: Vaso se cae.", "q: Es de vidrio.", "r: Se romperá."], c: "Conjunción (y) + Condicional (entonces)", opts: ["Conjunción (y) + Condicional (entonces)", "Disyunción + Negación"], f: "Dos condiciones necesarias para la ruptura." },
    { t: "Eres ciudadano mayor de edad si y solo si tienes 18 años y tu documento.", p: ["p: Eres mayor edad.", "q: Tienes 18 años.", "r: Tienes documento."], c: "Bicondicional + Conjunción (y)", opts: ["Bicondicional + Conjunción (y)", "Condicional + Disyunción"], f: "Definición legal expresada en lógica." },
    { t: "No es el caso que apruebes sin estudiar o sin entregar tareas.", p: ["p: Apruebas.", "q: Estudias.", "r: Entregas tareas."], c: "Negación externa + Disyunción (o)", opts: ["Negación externa + Disyunción (o)", "Conjunción + Bicondicional"], f: "Negación que envuelve una disyunción." },

    { t: "O el bus llega a tiempo o tomaremos un taxi, pero llegaremos al examen.", p: ["p: Bus llega tiempo.", "q: Tomamos taxi.", "r: Llegaremos examen."], c: "Disyunción fuerte (O... o) + Conjunción (pero)", opts: ["Disyunción fuerte (O... o) + Conjunción (pero)", "Condicional + Negación"], f: "Disyunción fuerte resolutiva con conclusión cierta." }

function createBtn(text, x, y, w, h, action, color="#313244") { buttons.push({text, x, y, w, h, action, color}); }

function startRound() {
    activeQuestions = [...dbPhase3].sort(() => 0.5 - Math.random()).slice(0, 7);
    currentIdx = 0; lives = 3; score = 0; mistakes = []; reportIdx = 0; gameState = 'GAME';
    resetTimer();
}

function resetTimer() {
    clearInterval(timerInterval);
    timer = 12;
    timerInterval = setInterval(() => {
        if (gameState === 'GAME' && feedbackTimer <= 0) {
            timer--;
            if (timer <= 0) handleError("⏱️ Tiempo agotado", true, "Ninguna (Tiempo agotado)");
        }
    }, 1000);
}

function render() {
    ctx.fillStyle = "#181825"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    buttons = [];

    if (gameState === 'START') {
        ctx.fillStyle = "#f38ba8"; ctx.font = "bold 32px 'Segoe UI'"; ctx.textAlign = "center";
        ctx.fillText("Fase 3: Descomposición Lógica", canvas.width/2, 160);
        ctx.fillStyle = "#cdd6f4"; ctx.font = "18px 'Segoe UI'";
        ctx.fillText("Analiza variables y conectores (12 segundos por reto).", canvas.width/2, 210);
        createBtn("▶ INICIAR FASE 3", canvas.width/2 - 120, 280, 240, 50, startRound, "#f38ba8");
    } else if (gameState === 'GAME') {
        let q = activeQuestions[currentIdx];
        ctx.fillStyle = "#a6adc8"; ctx.font = "16px 'Segoe UI'"; ctx.textAlign = "left";
        ctx.fillText(`Ptos: ${score} | Reto: ${currentIdx + 1}/7`, 20, 30);
        ctx.textAlign = "center"; ctx.fillStyle = timer <= 3 ? "#f38ba8" : "#f38ba8";
        ctx.font = "bold 18px 'Segoe UI'"; ctx.fillText(`⏱️ Tiempo: ${timer}s`, canvas.width/2, 30);
        ctx.textAlign = "right"; ctx.fillText(`Vidas: ${"❤️".repeat(lives)}`, canvas.width - 20, 30);
        
        ctx.fillStyle = "#27283d"; ctx.beginPath(); ctx.roundRect(60, 60, 680, 110, 15); ctx.fill();
        ctx.strokeStyle = "#f38ba8"; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = "#ffffff"; ctx.font = "bold 18px 'Segoe UI'"; ctx.textAlign = "center";
        
        if (q.t.length > 60) {
            let split = q.t.indexOf(' ', Math.floor(q.t.length/2));
            ctx.fillText(q.t.substring(0, split), canvas.width/2, 105);
            ctx.fillText(q.t.substring(split + 1), canvas.width/2, 135);
        } else { ctx.fillText(q.t, canvas.width/2, 120); }

        ctx.fillStyle = "#a6adc8"; ctx.font = "15px 'Segoe UI'"; ctx.textAlign = "left";
        ctx.fillText("Proposiciones simples detectadas:", 80, 200);
        ctx.fillStyle = "#89b4fa"; ctx.font = "15px 'Segoe UI'";
        q.p.forEach((prop, i) => {
            let col = i % 2 === 0 ? 80 : 420; let row = 225 + (Math.floor(i/2) * 22);
            ctx.fillText("✔ " + prop, col, row);
        });

        ctx.textAlign = "center"; ctx.fillStyle = "#cdd6f4"; ctx.font = "17px 'Segoe UI'";
        ctx.fillText("Selecciona los conectores lógicos correctos:", canvas.width/2, 330);

        createBtn(q.opts[0], 50, 360, 335, 65, () => check(q.c, q.opts[0], q.f));
        createBtn(q.opts[1], 415, 360, 335, 65, () => check(q.c, q.opts[1], q.f));
    } else if (gameState === 'END') {
        clearInterval(timerInterval);
        let aciertos = activeQuestions.length - mistakes.length;
        ctx.fillStyle = lives > 0 ? "#a6e3a1" : "#f38ba8"; ctx.font = "bold 34px 'Segoe UI'"; ctx.textAlign = "center";
        ctx.fillText(lives > 0 ? "🏆 ¡VICTORIA TOTAL! 🏆" : "¡Juego Terminado!", canvas.width/2, 130);
        
        ctx.fillStyle = "#ffffff"; ctx.font = "bold 22px 'Segoe UI'";
        ctx.fillText(`Puntuación: ${score} / 1400 pts (Base esperada)`, canvas.width/2, 185);
        ctx.fillStyle = "#cdd6f4"; ctx.font = "18px 'Segoe UI'";
        ctx.fillText(`Aciertos: ${aciertos} de ${activeQuestions.length} retos correctos`, canvas.width/2, 220);

        if (mistakes.length === 0) {
            ctx.fillStyle = "#a6e3a1"; ctx.font = "bold 18px 'Segoe UI'";
            ctx.fillText("🌟 ¡Maestro Lógico! Has obtenido la insignia 'Arquitecto Proposicional'.", canvas.width/2, 270);
        } else {
            createBtn(`🔍 VER RETROALIMENTACIÓN DE ERRORES (${mistakes.length})`, canvas.width/2 - 190, 270, 380, 50, () => {
                reportIdx = 0; gameState = 'REPORT';
            }, "#f38ba8");
        }
        createBtn("↻ JUGAR DE NUEVO", canvas.width/2 - 120, 360, 240, 50, startRound, "#f38ba8");
    } else if (gameState === 'REPORT') {
        let m = mistakes[reportIdx];
        ctx.fillStyle = "#f38ba8"; ctx.font = "bold 24px 'Segoe UI'"; ctx.textAlign = "center";
        ctx.fillText(`Análisis de Error (${reportIdx + 1} de ${mistakes.length})`, canvas.width/2, 60);

        ctx.fillStyle = "#27283d"; ctx.beginPath(); ctx.roundRect(50, 90, 700, 300, 15); ctx.fill();
        ctx.strokeStyle = "#f38ba8"; ctx.lineWidth = 2; ctx.stroke();

        ctx.fillStyle = "#ffffff"; ctx.font = "bold 16px 'Segoe UI'";
        if (m.q.length > 65) {
            let s = m.q.indexOf(' ', Math.floor(m.q.length/2));
            ctx.fillText(m.q.substring(0, s), canvas.width/2, 130);
            ctx.fillText(m.q.substring(s + 1), canvas.width/2, 155);
        } else { ctx.fillText(m.q, canvas.width/2, 140); }

        ctx.fillStyle = "#f38ba8"; ctx.font = "16px 'Segoe UI'";
        ctx.fillText(`❌ Tu error: ${m.user}`, canvas.width/2, 195);
        ctx.fillStyle = "#a6e3a1"; ctx.font = "bold 16px 'Segoe UI'";
        ctx.fillText(`✔ Conectores correctos: ${m.correct}`, canvas.width/2, 235);

        ctx.fillStyle = "#cdd6f4"; ctx.font = "15px 'Segoe UI'";
        ctx.fillText(`💡 Explicación: ${m.feedback}`, canvas.width/2, 280);

        if (reportIdx > 0) createBtn("⬅ ANTERIOR", 100, 420, 160, 45, () => reportIdx--, "#313244");
        if (reportIdx < mistakes.length - 1) createBtn("SIGUIENTE ➡", 540, 420, 160, 45, () => reportIdx++, "#313244");
        createBtn("↻ VOLVER AL RESUMEN", 280, 420, 240, 45, () => gameState = 'END', "#f38ba8");
    }

    buttons.forEach(b => {
        ctx.fillStyle = b.color; ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 10); ctx.fill();
        ctx.strokeStyle = "#a6adc8"; ctx.stroke(); ctx.fillStyle = "#ffffff"; ctx.font = "bold 14px 'Segoe UI'";
        ctx.textAlign = "center";
        if (b.text.length > 35 && gameState !== 'REPORT') {
            let s = b.text.indexOf('+', Math.floor(b.text.length/2));
            if (s === -1) s = b.text.indexOf(' ', Math.floor(b.text.length/2));
            ctx.fillText(b.text.substring(0, s), b.x + b.w/2, b.y + b.h/2 - 4);
            ctx.fillText(b.text.substring(s + 1), b.x + b.w/2, b.y + b.h/2 + 16);
        } else { ctx.fillText(b.text, b.x + b.w/2, b.y + b.h/2 + 6); }
    });

    if (feedbackTimer > 0) {
        ctx.fillStyle = "rgba(24,24,37,0.95)"; ctx.fillRect(40, 180, canvas.width-80, 90);
        ctx.strokeStyle = feedbackColor; ctx.lineWidth = 3; ctx.strokeRect(40, 180, canvas.width-80, 90);
        ctx.fillStyle = "#ffffff"; ctx.font = "18px 'Segoe UI'"; ctx.textAlign = "center";
        ctx.fillText(feedbackMsg, canvas.width/2, 230);
        feedbackTimer--;
    }
    requestAnimationFrame(render);
}

function check(correct, sel, f) {
    if (feedbackTimer > 0) return;
    if (sel === correct) {
        score += 200 + (timer * 15);
        feedbackColor = '#a6e3a1'; feedbackMsg = "¡CORRECTO! " + f; feedbackTimer = 80;
        setTimeout(nextQuestion, 1200);
    } else {
        handleError(`Estructura incorrecta`, false, sel);
    }
}

function handleError(msg, isTimeout, userSel) {
    let q = activeQuestions[currentIdx];
    mistakes.push({ q: q.t, user: userSel, correct: q.c, feedback: q.f });
    lives--; feedbackColor = '#f38ba8'; feedbackMsg = "💔 " + msg; feedbackTimer = 80;
    if (lives <= 0) setTimeout(() => gameState = 'END', 1200);
    else setTimeout(nextQuestion, 1200);
}

function nextQuestion() {
    currentIdx++;
    if (currentIdx >= activeQuestions.length) gameState = 'END';
    else resetTimer();
}

canvas.addEventListener('click', e => {
    const r = canvas.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    buttons.forEach(b => { if (x >= b.x && x <= b.x+b.w && y >= b.y && y <= b.y+b.h) b.action(); });
});

render();
</script>
</body>
</html>
