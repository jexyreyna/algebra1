<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego: Cadenas de Markov - Generador Dinámico</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #0f172a;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 850px;
            width: 100%;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 8px;
        }

        p.subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        .level-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            border: none;
        }

        .btn-level {
            border: 2px solid #e2e8f0;
            background: white;
            color: var(--text);
        }

        .btn-level.active {
            border-color: var(--primary);
            background-color: var(--primary);
            color: white;
        }

        .btn-new-game {
            background-color: var(--secondary);
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-new-game:hover {
            background-color: #334155;
            transform: scale(1.02);
        }

        .game-area {
            background-color: #f1f5f9;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .context-box {
            margin-bottom: 20px;
            padding: 12px;
            background-color: #e0e7ff;
            border-left: 4px solid var(--primary);
            border-radius: 4px;
            line-height: 1.5;
        }

        .matrix-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        th {
            background-color: #f8fafc;
            font-weight: 600;
        }

        .input-cell {
            width: 85px;
            padding: 8px;
            text-align: center;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            outline: none;
            background-color: #fef08a;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .input-cell:focus {
            border-color: var(--primary);
            background-color: #ffffff;
        }

        /* Tanques de Energía por Columna */
        .tanks-row td {
            background-color: #f8fafc;
            padding: 15px 10px;
            vertical-align: top;
        }

        .tank-label {
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .progress-bar {
            height: 12px;
            background-color: #e2e8f0;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 5px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            transition: width 0.3s, background-color 0.3s;
        }

        .status-text {
            font-size: 0.8rem;
            font-weight: bold;
        }

        .btn-check {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-check:hover {
            background-color: var(--primary-hover);
        }

        .feedback-message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            min-height: 27px;
        }

        .color-success { color: var(--success); }
        .color-warning { color: var(--warning); }
        .color-danger { color: var(--danger); }
        .bg-success { background-color: var(--success); }
        .bg-warning { background-color: var(--warning); }
        .bg-danger { background-color: var(--danger); }
    </style>
</head>
<body>

<div class="container">
    <h1>El Rompecabezas Matricial</h1>
    <p class="subtitle">Completa los datos faltantes. ¡La suma de las probabilidades de cada columna siempre debe ser igual a la unidad (1)!</p>

    <div class="controls-row">
        <div class="level-selector">
            <button class="btn btn-level active" onclick="changeLevel(0)">Nivel 1 (2 Estados)</button>
            <button class="btn btn-level" onclick="changeLevel(1)">Nivel 2 (3 Estados)</button>
            <button class="btn btn-level" onclick="changeLevel(2)">Nivel 3 (4 Estados)</button>
        </div>
        <button class="btn btn-new-game" onclick="startNewGame()">🔄 Nueva Partida</button>
    </div>

    <div class="game-area">
        <div class="context-box" id="context-text"></div>
        <div class="matrix-container" id="matrix-container"></div>
    </div>

    <button class="btn btn-check" onclick="checkWinCondition()">Verificar Energía del Sistema</button>
    <div class="feedback-message" id="feedback-msg"></div>
</div>

<script>
    const levelsConfig = [
        {
            title: "Nivel 1: El Clima del Planeta",
            context: "En un planeta alterno, el clima solo tiene dos estados: **Sol (S)** y **Lluvia (L)**. Los datos climáticos cambian constantemente. Completa las casillas amarillas para que el modelo probabilístico sea válido.",
            states: ["Sol (S)", "Lluvia (L)"]
        },
        {
            title: "Nivel 2: Comportamiento del Consumidor",
            context: "Tres marcas de telefonía (**A**, **B** y **C**) compiten ferozmente. Cada año, un estudio de mercado revela nuevas tasas de retención y cambio entre marcas. Rellena las probabilidades faltantes.",
            states: ["Marca A", "Marca B", "Marca C"]
        },
        {
            title: "Nivel 3: El Laberinto y el Castillo",
            context: "Un jugador se mueve entre **Bosque (B)**, **Cueva (C)**, **Río (R)** y **Castillo (K)**. Recuerda: El Castillo es un *estado absorbente* (quien entra, ya no sale, por lo que su probabilidad de quedarse es 1). ¡Ajusta el resto del mapa!",
            states: ["Bosque", "Cueva", "Río", "Castillo"]
        }
    ];

    let currentLevel = 0;
    let currentData = [];
    let currentSolutions = [];

    // Generador Propedéutico de Probabilidades
    function generateLevelData(levelIndex) {
        const numStates = levelsConfig[levelIndex].states.length;
        currentData = [];
        currentSolutions = [];

        for (let r = 0; r < numStates; r++) {
            currentData.push(new Array(numStates).fill(0));
            currentSolutions.push(new Array(numStates).fill(0));
        }

        for (let c = 0; c < numStates; c++) {
            let colVals = [];
            let isAbsorbing = (levelIndex === 2 && c === 3); // Columna Castillo en Nivel 3

            if (isAbsorbing) {
                colVals = [0, 0, 0, 1];
            } else {
                let remaining = 100;
                // Paso de 10% para Nivel 1, paso de 5% para Niveles 2 y 3 (cálculo mental fácil)
                let step = (levelIndex === 0) ? 10 : 5; 
                
                for (let r = 0; r < numStates - 1; r++) {
                    // Asegurar que queden al menos 'step' para las filas restantes
                    let maxSteps = Math.floor((remaining - step * (numStates - 1 - r)) / step);
                    let minSteps = 1; // Evitar ceros en transiciones normales para mayor diversión
                    let chosenSteps = minSteps + Math.floor(Math.random() * (maxSteps - minSteps + 1));
                    let val = chosenSteps * step;
                    colVals.push(val / 100);
                    remaining -= val;
                }
                colVals.push(Math.round(remaining) / 100);
                
                // Mezclar la columna para que el valor más grande no siempre quede al final
                colVals.sort(() => Math.random() - 0.5);
            }

            // Elegir aleatoriamente qué fila será la incógnita en esta columna
            let hiddenRow = Math.floor(Math.random() * numStates);

            for (let r = 0; r < numStates; r++) {
                currentSolutions[r][c] = colVals[r];
                if (r === hiddenRow) {
                    currentData[r][c] = "input";
                } else {
                    currentData[r][c] = colVals[r];
                }
            }
        }
    }

    function changeLevel(index) {
        currentLevel = index;
        document.querySelectorAll('.btn-level').forEach((btn, idx) => {
            btn.classList.toggle('active', idx === index);
        });
        startNewGame();
    }

    function startNewGame() {
        generateLevelData(currentLevel);
        renderGame();
    }

    function renderGame() {
        const config = levelsConfig[currentLevel];
        document.getElementById('context-text').innerHTML = config.context;
        document.getElementById('feedback-msg').innerText = "";

        let html = '<table><thead><tr><th>Destino \\ Origen</th>';
        config.states.forEach(state => {
            html += `<th>${state}</th>`;
        });
        html += '</tr></thead><tbody>';

        for (let r = 0; r < config.states.length; r++) {
            html += `<tr><th>${config.states[r]}</th>`;
            for (let c = 0; c < config.states.length; c++) {
                let val = currentData[r][c];
                if (val === "input") {
                    html += `<td><input type="number" step="any" class="input-cell" data-row="${r}" data-col="${c}" placeholder="?" oninput="updateTanks()"></td>`;
                } else {
                    html += `<td>${val.toFixed(2).replace(/\.00$/, '')}</td>`;
                }
            }
            html += '</tr>';
        }

        // Fila de Tanques de Energía
        html += '<tr class="tanks-row"><th>Estado de Columna</th>';
        for (let c = 0; c < config.states.length; c++) {
            html += `
                <td>
                    <div class="tank-label" id="label-col-${c}">Suma: 0</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="bar-col-${c}"></div>
                    </div>
                    <div class="status-text" id="status-col-${c}">-</div>
                </td>
            `;
        }
        html += '</tr></tbody></table>';

        document.getElementById('matrix-container').innerHTML = html;
        updateTanks();
    }

    function updateTanks() {
        const numCols = levelsConfig[currentLevel].states.length;

        for (let c = 0; c < numCols; c++) {
            let sum = 0;
            for (let r = 0; r < numCols; r++) {
                let val = currentData[r][c];
                if (val === "input") {
                    const inputEl = document.querySelector(`input[data-row="${r}"][data-col="${c}"]`);
                    val = inputEl && inputEl.value !== "" ? parseFloat(inputEl.value) : 0;
                }
                sum += val;
            }

            // Evitar errores de precisión flotante en JS (ej: 0.300000000004)
            sum = Math.round(sum * 1000) / 1000;

            const bar = document.getElementById(`bar-col-${c}`);
            const label = document.getElementById(`label-col-${c}`);
            const status = document.getElementById(`status-col-${c}`);

            label.innerText = `Suma: ${sum}`;
            let percentage = Math.min(sum * 100, 100);
            bar.style.width = `${percentage}%`;

            if (sum === 1) {
                bar.className = 'progress-fill bg-success';
                status.innerText = '¡Óptimo (100%)!';
                status.className = 'status-text color-success';
            } else if (sum > 1) {
                bar.className = 'progress-fill bg-danger';
                status.innerText = '¡Exceso!';
                status.className = 'status-text color-danger';
            } else {
                bar.className = 'progress-fill bg-warning';
                status.innerText = 'Falta probabilidad';
                status.className = 'status-text color-warning';
            }
        }
    }

    function checkWinCondition() {
        const numCols = levelsConfig[currentLevel].states.length;
        let allCorrect = true;

        for (let r = 0; r < numCols; r++) {
            for (let c = 0; c < numCols; c++) {
                if (currentData[r][c] === "input") {
                    const inputEl = document.querySelector(`input[data-row="${r}"][data-col="${c}"]`);
                    const val = inputEl && inputEl.value !== "" ? parseFloat(inputEl.value) : -1;
                    if (Math.abs(val - currentSolutions[r][c]) > 0.001) {
                        allCorrect = false;
                    }
                }
            }
        }

        const msgEl = document.getElementById('feedback-msg');
        if (allCorrect) {
            msgEl.innerText = "¡Excelentes cálculos! Toda la matriz de transición es perfectamente estocástica. 🎯";
            msgEl.className = "feedback-message color-success";
        } else {
            msgEl.innerText = "Alguna columna no suma 1 o el valor es incorrecto. ¡Revisa tus restas!";
            msgEl.className = "feedback-message color-danger";
        }
    }

    // Iniciar el juego automáticamente al cargar
    window.onload = () => startNewGame();
</script>

</body>
</html>
